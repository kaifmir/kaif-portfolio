<!doctype html>
<html lang="en">

<title>Designing Houzy — Kaif Saleem</title>
<meta name="description" content="An interactive case study told through a buyer's eyes: the psychology and design decisions behind Houzy, Housing.com's conversational AI for property search." />
<link rel="icon" type="image/png" href="../assets/favicon.png" />

<style>
  :root {
    --lime: #e4ff3a;
    --ink: #171313;
    --ink-70: rgba(23,19,19,.7);
    --ink-50: rgba(23,19,19,.5);
    --line: rgba(23,19,19,.1);
    --stage: #15120e;
    --stage-2: #211d18;
    --paper: #fbfaf6;
    --cream: #fff6d6;
    --sans: "Figtree", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --pill: "Playfair Display", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--stage); color: #fff; -webkit-font-smoothing: antialiased; overflow: hidden; }
  img { display: block; max-width: 100%; }
  a { color: inherit; }

  /* chrome */
  .top { position: fixed; inset: 0 0 auto 0; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 20; }
  .top a, .count { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.55); text-decoration: none; }
  .top a:hover { color: #fff; }
  .bar { position: fixed; left: 0; top: 0; height: 3px; background: var(--lime); width: 0; transition: width .35s ease; z-index: 21; }
  .controls { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; z-index: 20; }
  .controls button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff; font: 700 18px var(--sans); cursor: pointer; }
  .controls button:hover { background: var(--lime); color: var(--ink); }
  .controls button:disabled { opacity: .3; cursor: default; background: transparent; color: #fff; }
  .hint { font-size: 12px; color: rgba(255,255,255,.45); }

  #stage { position: absolute; inset: 48px 0 64px; display: flex; align-items: center; justify-content: center; padding: 0 24px; }

  /* phone scene */
  .scene { --phone-w: min(calc((100vh - 112px) * 360 / 696), calc(780px * 360 / 696)); position: relative; width: min(1240px, 100%); height: 100%; display: grid; grid-template-columns: minmax(240px, 1fr) var(--phone-w) minmax(260px, 1fr); grid-template-rows: minmax(0, 100%); gap: 72px; align-items: center; }
  .narr { display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: flex-end; text-align: left; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 4px; align-self: flex-end; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: 13px; letter-spacing: 0; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--lime); align-self: flex-end; }
  .say { max-width: 360px; background: #fff; color: var(--ink); border-radius: 20px 20px 4px 20px; padding: 14px 18px; font-size: 19px; line-height: 27px; letter-spacing: -.02em; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: opacity .3s, transform .3s; }
  .say.old { opacity: .32; transform: scale(.94); transform-origin: right center; font-size: 16px; line-height: 22px; padding: 10px 14px; }
  .say.me { background: var(--lime); }
  .say.aside { background: transparent; color: rgba(255,255,255,.8); box-shadow: none; border: 1px dashed rgba(255,255,255,.35); font-style: italic; font-size: 16px; line-height: 23px; }
  .say.enter { animation: pop .35s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }

  .device { position: relative; height: 100%; min-height: 0; max-height: 780px; display: flex; align-items: center; justify-content: center; }
  .screen { position: relative; width: var(--phone-w); height: calc(var(--phone-w) * 696 / 360); flex: 0 0 auto; border-radius: 34px; overflow: hidden; background: #fff; box-shadow: 0 0 0 8px #000, 0 0 0 9px rgba(255,255,255,.15), 0 30px 80px rgba(0,0,0,.6); }
  .screen { container-type: inline-size; }
  /* live screens have no intrinsic size, so size them from the stage height explicitly */
  .screen.live {
    container-type: normal; /* Safari sizes containers as if empty */
  }

  .scene .device { width: 100%; }
  #live-layer { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 3; pointer-events: none; }
  .livewrap { position: absolute; overflow: hidden; border-radius: 34px; visibility: hidden; }
  .livewrap iframe { position: absolute; left: 0; top: 0; width: 360px; height: 696px; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; opacity: 0; transition: opacity .35s; }
  .livewrap iframe.ready { opacity: 1; }
  .livewrap.blocked { display: none; }
  .scene .link { z-index: 6; }
  @media (max-width: 900px) { .livewrap { border-radius: 28px; } }
  .screen.live > img.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .screen.live iframe { position: absolute; left: 0; top: 0; width: 360px; height: 740px; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; opacity: 0; transition: opacity .35s; }
  .screen.live iframe.ready { opacity: 1; }
  .screen.live.blocked iframe { display: none; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  /* property page inside Houzy: one continuous page stitched from the two screenshots */
  .pdps { position: absolute; inset: 0; background: #faf9f5; overflow: hidden; z-index: 1; }
  .screen .pdps img { height: auto; object-fit: initial; display: block; width: 100%; }
  .pdps-track { position: absolute; left: 0; top: 0; width: 100%; transform: translateY(-99.8cqw); will-change: transform; }
  .pdps-head { position: absolute; left: 0; top: 0; box-shadow: 0 2px 10px rgba(0,0,0,.06); z-index: 2; }
  .pdps-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; }
  .pdps-sheet img { position: absolute; left: 0; bottom: 0; }
  .pdps-sheet.up img { animation: sheet-up .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sheet-up { from { transform: translateY(35%); opacity: 0; } to { transform: none; opacity: 1; } }
  /* follow-up pills for this property, scrolling sideways (360px design: 40px pills, 14px Rubik, 12px gaps) */
  .pdps-pills { position: absolute; left: 0; right: 0; bottom: 22.4cqw; height: 13cqw; background: #fff; overflow: hidden; display: flex; align-items: center; }
  .pdps-pills .row { display: flex; gap: 3.33cqw; padding-left: 4.2cqw; width: max-content; will-change: transform; animation: pills-scroll 7s 1s ease-in-out infinite; }
  .pdps-pills .pp { display: inline-flex; align-items: center; gap: 2.2cqw; height: 11.1cqw; padding: 0 4.44cqw; border: 1px solid #e1e2e8; border-radius: 999px; background: #fff; font: 400 3.89cqw/1 "Rubik", sans-serif; color: #656565; white-space: nowrap; }
  .pdps-pills .pp svg { width: 4.4cqw; height: 4.4cqw; }
  @keyframes pills-scroll { 0%, 14% { transform: translateX(0); } 46%, 62% { transform: translateX(var(--shift, -60cqw)); } 92%, 100% { transform: translateX(0); } }
  .pdps.anim .pdps-pills { animation: sheet-up .45s 1.45s cubic-bezier(.2,.8,.2,1) both; }
  .pdps.anim .pdps-pills .row { animation-delay: 2.6s; }
  @media (prefers-reduced-motion: reduce) { .pdps-pills .row { animation: none; } }
  /* animated version: drag up → page scrolls → header slides in → ask bar grows into pills */
  .pdps.anim .pdps-track { animation: pdps-scroll 1.9s .5s cubic-bezier(.45,0,.25,1) both; }
  @keyframes pdps-scroll { from { transform: translateY(0); } to { transform: translateY(-99.8cqw); } }
  .pdps.anim .pdps-head { animation: pdps-head .35s 1.75s ease-out both; }
  @keyframes pdps-head { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
  .pdps.anim .s-compact { animation: pdps-out .3s 1.3s ease-in both; }
  @keyframes pdps-out { to { opacity: 0; transform: translateY(20%); } }
  .pdps.anim .s-pills { animation: sheet-up .45s 1.45s cubic-bezier(.2,.8,.2,1) both; }
  .pdps .drag { position: absolute; left: 62%; top: 74%; width: 8.5cqw; height: 8.5cqw; z-index: 5; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); animation: pdps-drag 1.9s .5s cubic-bezier(.45,0,.25,1) both; }
  @keyframes pdps-drag { 0% { top: 74%; opacity: 1; } 85% { top: 36%; opacity: 1; } 100% { top: 34%; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pdps.anim * { animation: none !important; } .pdps.anim .s-compact, .pdps .drag { display: none; } }
  /* cursor gestures between screens */
  .gest { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .gest .cursor-ico { position: absolute; width: 8.5cqw; height: 8.5cqw; left: 78%; top: 92%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .gest.tap .cursor-ico { animation: g-move .6s cubic-bezier(.4,0,.2,1) forwards, g-press .2s .66s ease-in-out; }
  .gest.swipe .cursor-ico { left: 60%; top: var(--y); animation: g-drag .7s .2s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes g-move { to { left: var(--x); top: var(--y); } }
  @keyframes g-press { 50% { transform: scale(.82); } }
  @keyframes g-drag { to { top: var(--y2); } }
  .gest .ripple { position: absolute; left: var(--x); top: var(--y); width: 16cqw; height: 16cqw; margin: -8cqw 0 0 -8cqw; border-radius: 50%; background: rgba(94,35,220,.28); transform: scale(0); opacity: 0; }
  .gest.tap .ripple { animation: g-ripple .45s .68s ease-out forwards; }
  @keyframes g-ripple { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .screen.zoom-in > img { transform-origin: var(--ox) var(--oy); animation: g-zoom .48s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes g-zoom { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .screen.scroll-in > img { animation: g-scroll .5s cubic-bezier(.2,.8,.2,1) both; }
  .screen.fade-in > img { animation: g-fade .35s ease-out both; }
  /* screenshots without a status bar: add one, and fit the screen to full width (no side crop) */
  .screen.padded { background: #fff; }
  .screen.padded > img { position: absolute; left: 0; top: 9.39cqw; width: 100%; height: auto; object-fit: initial; }
  .screen.padded > img.sb { top: 0; }
  @keyframes g-fade { from { opacity: 0; } to { opacity: 1; } }
  .screen.arrive-scroll > img { animation: g-arrive 1.4s .3s cubic-bezier(.45,0,.25,1) both; }
  @keyframes g-arrive { from { transform: translateY(32%); } to { transform: none; } }
  /* a nudge that rises over the page as a bottom sheet */
  .screen .sheet-up { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; animation: g-sheet .55s var(--d, .6s) cubic-bezier(.2,.85,.25,1) both; }
  .screen .sheet-up img { display: block; width: 100%; height: auto; border-radius: 5.5cqw 5.5cqw 0 0; filter: drop-shadow(0 -1px 16px rgba(0,0,0,.16)); }
  @keyframes g-sheet { from { transform: translateY(105%); } to { transform: none; } }
  @keyframes g-scroll { from { transform: translateY(26%); opacity: .2; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .gest { display: none; } .screen.zoom-in > img, .screen.scroll-in > img { animation: none; } }
  /* loading shimmer sweeping across a skeleton screenshot */
  .skeleton-shimmer { position: absolute; left: 0; right: 0; top: 16%; height: 48%; z-index: 1; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 70%);
    background-size: 220% 100%; animation: skel 1.6s ease-in-out infinite; }
  @keyframes skel { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton-shimmer { animation: none; display: none; } }
  /* swipeable property carousel, rebuilt from the card screenshot */
  .carousel { position: absolute; left: 0; right: 0; top: 37.9cqw; height: 123cqw; background: #f6f6f6; overflow: hidden; z-index: 1; }
  .carousel .track { position: absolute; left: 4.4cqw; top: 0.4cqw; display: flex; gap: 3.2cqw; align-items: flex-start; will-change: transform; animation: swipe 9s cubic-bezier(.65,0,.35,1) infinite; }
  .carousel img { display: block; height: auto; border-radius: 4.4cqw; box-shadow: 0 0 0 1px #e4e4e4; }
  .carousel img.c { width: 73.2cqw; }
  .carousel img.v { width: 42.5cqw; height: 121.2cqw; object-fit: cover; }
  @keyframes swipe {
    0%, 10% { transform: translateX(0); }
    22%, 34% { transform: translateX(-76.4cqw); }
    46%, 58% { transform: translateX(-152.8cqw); }
    70%, 84% { transform: translateX(-180.5cqw); }
    100% { transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) { .carousel .track { animation: none; } }
  /* the prototype's loading state, scaled to the screen (360px design) */
  .loading-row { position: absolute; left: 2%; top: 23.4%; width: 90%; height: 5.4%; background: #f6f6f6; display: flex; align-items: center; padding-left: 2.2cqw; z-index: 1; }
  .loader-5 { height: 6.67cqw; width: 6.67cqw; position: relative; flex: 0 0 auto; animation: loader-5-1 2s cubic-bezier(.77,0,.175,1) infinite; }
  .loader-5::before, .loader-5::after, .loader-5 span::before, .loader-5 span::after { content: ""; display: block; position: absolute; margin: auto; width: 1.67cqw; height: 1.67cqw; background: #B8A082; border-radius: 50%; }
  .loader-5::before { top: 0; left: 0; bottom: 0; animation: loader-5-2 2s cubic-bezier(.77,0,.175,1) infinite; }
  .loader-5::after { top: 0; right: 0; bottom: 0; animation: loader-5-3 2s cubic-bezier(.77,0,.175,1) infinite; }
  .loader-5 span { display: block; position: absolute; inset: 0; margin: auto; height: 6.67cqw; width: 6.67cqw; }
  .loader-5 span::before { top: 0; left: 0; right: 0; animation: loader-5-4 2s cubic-bezier(.77,0,.175,1) infinite; }
  .loader-5 span::after { bottom: 0; left: 0; right: 0; animation: loader-5-5 2s cubic-bezier(.77,0,.175,1) infinite; }
  @keyframes loader-5-1 { to { transform: rotate(360deg); } }
  @keyframes loader-5-2 { 50% { transform: translate3d(0, -5cqw, 0) scale(.5); } }
  @keyframes loader-5-3 { 50% { transform: translate3d(-5cqw, 0, 0) scale(.5); } }
  @keyframes loader-5-4 { 50% { transform: translate3d(0, 5cqw, 0) scale(.5); } }
  @keyframes loader-5-5 { 50% { transform: translate3d(0, -5cqw, 0) scale(.5); } }
  .loading-row .shimmer { margin-left: 2.8cqw; font: 400 3.89cqw/1.2 "Rubik", sans-serif; white-space: nowrap; background: linear-gradient(90deg, #666 0%, #666 38%, #999 50%, #666 62%, #666 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: typing-shimmer 2.5s ease-in-out infinite; }
  @keyframes typing-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  /* animated starter prompts on the first-open screen, matching the live prototype
     (Rubik 14px, 40px pills, 12px gaps, both rows drift left at 12px/s on a 360px screen) */
  .prompts { position: absolute; left: 0; right: 0; top: 48.3%; height: 15.6%; background: #f7f7f7; overflow: hidden; }   /* starts above the screenshot's own pill row so none of it peeks out */
  .prompts::before, .prompts::after { content: ""; position: absolute; top: 0; bottom: 0; width: 6.67cqw; z-index: 2; pointer-events: none; }
  .prompts::before { left: 0; background: linear-gradient(to right, #f7f7f7, rgba(247,247,247,0)); }
  .prompts::after { right: 0; background: linear-gradient(to left, #f7f7f7, rgba(247,247,247,0)); }
  .prow { position: absolute; left: 0; display: flex; width: max-content; will-change: transform; animation: drift 60s linear infinite; }
  .prow.r1 { top: 3.23cqw; } .prow.r2 { top: 17.13cqw; }
  .ppill { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2.22cqw; height: 11.11cqw; margin-right: 3.33cqw; padding: 0 4.44cqw; background: linear-gradient(to bottom, #fff 0%, #fafafa 100%); border: 1px solid var(--b); border-radius: 6.67cqw; font: 400 3.89cqw/1 "Rubik", system-ui, sans-serif; color: #656565; white-space: nowrap; }
  .ppill img { width: 4.44cqw; height: 4.44cqw; }
  @keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
  @media (prefers-reduced-motion: reduce) { .prow { animation: none !important; } }
  /* lightbox mode: the hero's photo strip, and the full-screen gallery laid over the phone */
  .lbx-hero { max-width: 980px; }
  .lbx-strip { width: min(1100px, 92vw); margin-top: 34px; overflow: hidden; -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); }
  .lbx-belt { display: flex; gap: 14px; width: max-content; animation: lbx-drift 38s linear infinite; }
  .lbx-belt img { height: 150px; width: auto; border-radius: 14px; display: block; }
  .chap .lbx-credit { margin-top: 14px; font-size: 11px; line-height: 1.4; color: #6e6e73; }
  @keyframes lbx-drift { to { transform: translateX(-50%); } }
  /* Airbnb-style viewer: dark, centred room + count, rounded photos inset from the edges */
  .scene.arrive.from-strip:not(.has-live) .screen { animation: lbx-in .5s cubic-bezier(.2,.7,.2,1) both; }   /* coming from the photo strip: no rise, the photo flies in instead */
  @keyframes lbx-in { from { opacity: 0; } to { opacity: 1; } }
  .screen.dark { background: #fff !important; }
  .screen.dark > img:not(.sb) { visibility: hidden; }
  .lbx { position: absolute; inset: 0; z-index: 4; background: #fff; font-family: "Rubik", system-ui, sans-serif; color: #222; }
  .lbx-sb { display: flex; justify-content: space-between; align-items: center; height: 7.6%; padding: 0 5cqw; font-size: 3.9cqw; }
  .lbx-sb svg { height: 3.6cqw; width: auto; margin-left: 1.2cqw; }
  .lbx-hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 1.5cqw 3.3cqw 0; }
  .lbx-hd .ic { width: 9cqw; height: 9cqw; display: grid; place-items: center; }
  .lbx-hd .ic svg { width: 5cqw; height: 5cqw; }
  .lbx-hd .end { justify-self: end; display: flex; }
  .lbx-ttl { text-align: center; }
  .lbx-room { display: block; font-size: 4.2cqw; font-weight: 500; line-height: 1.25; transition: opacity .25s; }
  .lbx-room.swap { opacity: 0; }
  .lbx-n { display: block; margin-top: .4cqw; font-size: 3.3cqw; color: #656565; font-variant-numeric: tabular-nums; }
  .lbx-x { width: 5cqw; height: 5cqw; }
  .lbx-view { position: absolute; left: 0; right: 0; top: 24%; height: 50%; overflow: hidden; touch-action: pan-y; cursor: grab; }
  .lbx-track { display: flex; gap: 3.3cqw; height: 100%; padding: 0 4.4cqw; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .lbx-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; border-radius: 3.3cqw; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .lbx-cta { position: absolute; left: 6.7cqw; right: 6.7cqw; bottom: 9cqw; height: 12.2cqw; border-radius: 2.2cqw; background: #5e23dc; color: #fff; display: flex; align-items: center; justify-content: center; gap: 2cqw; font-size: 3.9cqw; font-weight: 500; }
  .lbx-cta svg { width: 4.2cqw; height: 4.2cqw; }
  .lbx-fly { position: fixed; z-index: 60; object-fit: cover; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .lbx-belt { animation: none; } .lbx-track { transition: none; } }
  /* hand-drawn pencil callouts */
  :root { --pencil: #e5533d; }
  .ring { position: absolute; pointer-events: none; z-index: 3; }
  .ring svg { display: none; } /* the ring is now just an invisible target for the arrow */
  .ring path, .link path { fill: none; stroke: var(--pencil); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .ring path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s cubic-bezier(.5,0,.3,1) forwards; }
  .link { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 4; }
  .link circle { fill: var(--pencil); }
  .link path.tie { stroke-width: 1.6; opacity: .75; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .ring path, .link path { animation: none; stroke-dashoffset: 0; } }

  .side { display: flex; flex-direction: column; gap: 14px; justify-content: center; max-width: 380px; }
  .card { border-radius: 18px; padding: 18px 20px; font-size: 15px; line-height: 22px; color: var(--ink); box-shadow: 0 14px 40px rgba(0,0,0,.4); animation: pop .4s ease both; }

  /* opening slide: a full-screen Figma canvas */
  .canvas { position: fixed; inset: 0; z-index: 5; background: #f4f3ef; background-image: radial-gradient(rgba(23,19,19,.13) 1px, transparent 1px); background-size: 22px 22px; color: var(--ink); display: grid; grid-template-columns: minmax(0, 560px) auto; justify-content: center; align-items: center; column-gap: clamp(56px, 9vw, 140px); padding: 72px 48px 88px; overflow: hidden; }

  .fig-frame { position: relative; z-index: 2; }

  .fig-sel i { position: absolute; width: 8px; height: 8px; background: #fff; border: 1.5px solid #0d99ff; }
  .fig-sel i:nth-child(1) { left: -5px; top: -5px; } .fig-sel i:nth-child(2) { right: -5px; top: -5px; }
  .fig-sel i:nth-child(3) { left: -5px; bottom: -5px; } .fig-sel i:nth-child(4) { right: -5px; bottom: -5px; }
  .fig-size { position: absolute; bottom: -32px; left: 50%; transform: translateX(-50%); background: #0d99ff; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  /* the phone plays the real prototype at 375 × 812, scaled to fit */
  .demo { position: relative; height: min(calc(100vh - 200px), 720px); aspect-ratio: 375 / 812; border-radius: 34px; overflow: hidden; background: #fff; box-shadow: 0 0 0 8px #111, 0 30px 70px rgba(0,0,0,.22); }
  .demo iframe { position: absolute; left: 0; top: 0; width: 375px; height: 812px; border: 0; transform-origin: 0 0; transform: scale(var(--s, 1)); pointer-events: none; }

  .demo .tapper { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 3; opacity: 0; transition: transform .7s cubic-bezier(.4,0,.2,1), opacity .25s; pointer-events: none; }
  .demo .tapper svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .demo .tapper.on { opacity: 1; }
  .demo .tapper.press svg { animation: g-press .2s ease-in-out; }
  .demo .tapper::before { content: ""; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; background: rgba(94,35,220,.3); transform: scale(0); }
  .demo .tapper.press::before { animation: d-ripple .5s ease-out; }
  @keyframes d-ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .fig-frame .caption { position: absolute; left: 50%; bottom: -70px; transform: translateX(-50%); z-index: 3; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .fig-frame .caption.on { opacity: 1; }
  .cursor { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; will-change: transform; }
  .cursor svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
  .cursor em { position: absolute; left: 16px; top: 18px; font-style: normal; font-size: 12px; font-weight: 700; color: #fff; padding: 3px 8px; border-radius: 4px 10px 10px 10px; white-space: nowrap; }
  .c1 { animation: c1 42s ease-in-out infinite; } .c2 { animation: c2 50s ease-in-out infinite; } .c3 { animation: c3 38s ease-in-out infinite; } .c4 { animation: c4 46s ease-in-out infinite; }
  @keyframes c1 { 0%,100% { transform: translate(56%, 80%); } 25% { transform: translate(55%, 26%); } 50% { transform: translate(57%, 54%); } 75% { transform: translate(40%, 90%); } }

  .cursor-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }

  /* intro canvas stays light: a softer lift for the phone on the cream canvas */

  body { font-family: "Inter", system-ui, sans-serif; letter-spacing: -.011em; }

const SB = 44;   // status bar height inside the intro phone, in 375-wide app pixels

  f.src = PROTO; f.title = 'Houzy prototype'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true');
  demo.insertBefore(f, demo.querySelector('.tapper'));

  fit(); addEventListener('resize', fit);
