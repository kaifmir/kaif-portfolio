<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#ffe3d0"/><stop offset="1" stop-color="#f7c9b0"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c7a4"/><stop offset="1" stop-color="#e8a983"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2a24"/><stop offset="1" stop-color="#1e1411"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#5e23dc"/></linearGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- hair back -->
    <path d="M44 104c-6-44 22-74 56-74s64 28 58 74c-2 22-6 46-10 62H54c-6-16-8-40-10-62z" fill="url(#hair)"/>
    <!-- shoulders -->
    <path d="M32 214c4-38 32-56 68-56s64 18 68 56z" fill="url(#top)"/>
    <path d="M86 150h28v16c0 8-28 8-28 0z" fill="#e3a07c"/>
    <!-- face -->
    <ellipse cx="100" cy="104" rx="41" ry="47" fill="url(#skin)"/>
    <ellipse cx="59" cy="108" rx="7" ry="10" fill="#eab08c"/><ellipse cx="141" cy="108" rx="7" ry="10" fill="#eab08c"/>
    <!-- fringe -->
    <path d="M58 98c2-30 22-48 46-48 22 0 38 16 40 40-14-4-30-14-38-28-8 18-28 32-48 36z" fill="url(#hair)"/>
    <!-- bun -->
    <circle cx="100" cy="30" r="17" fill="url(#hair)"/>
    <!-- brows, eyes -->
    <path d="M76 95c6-4 13-4 19-1M105 94c6-3 13-3 19 1" fill="none" stroke="#2b1d18" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="85" cy="108" rx="5.2" ry="6.4" fill="#2b1d18"/><ellipse cx="115" cy="108" rx="5.2" ry="6.4" fill="#2b1d18"/>
    <circle cx="86.8" cy="105.8" r="1.7" fill="#fff"/><circle cx="116.8" cy="105.8" r="1.7" fill="#fff"/>
    <!-- bindi, nose, cheeks, smile -->
    <circle cx="100" cy="92" r="2.4" fill="#d6336c"/>
    <path d="M100 113c-2 6-3 9 0 11" fill="none" stroke="#c98563" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="75" cy="124" rx="8" ry="5" fill="#f19a8e" opacity=".45"/><ellipse cx="125" cy="124" rx="8" ry="5" fill="#f19a8e" opacity=".45"/>
    <path d="M88 132c7 7 17 7 24 0" fill="#b84a4a" stroke="#9c3a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- earrings -->
    <circle cx="59" cy="124" r="3.2" fill="#f5c542"/><circle cx="141" cy="124" r="3.2" fill="#f5c542"/>
  </g>
</svg>
